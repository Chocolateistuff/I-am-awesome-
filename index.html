<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutellaWaffle - Creative & Curious</title>
</head>
<body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 20vh; color: #6b5274;">Loading the original website…</p>
    <script>
        (async function restoreOriginalSite() {
            const originalUrl = 'https://raw.githubusercontent.com/Chocolateistuff/I-am-awesome-/f7f34cfa0251b5b52a2260d33906f139e241cc88/index.html';
            try {
                const response = await fetch(originalUrl);
                if (!response.ok) throw new Error('Could not load the saved original website.');
                let html = await response.text();

                // Keep the original page and all of its sections/features, changing only the requested details.
                html = html.replace('</style>', `
                    /* Bookshelf spines */
                    .books-grid {
                        display: flex !important;
                        flex-wrap: wrap;
                        align-items: flex-end;
                        justify-content: center;
                        gap: 8px;
                        padding: 24px 12px 0;
                        border-bottom: 18px solid #9a653d;
                        border-radius: 6px 6px 0 0;
                        background: linear-gradient(to bottom, transparent 0 94%, #c28a57 94% 100%);
                    }
                    .book-card.book-spine {
                        width: 62px;
                        height: 230px;
                        padding: 12px 8px;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: space-between;
                        border: 0;
                        border-left: 5px solid rgba(255,255,255,.25);
                        border-radius: 4px 8px 2px 2px;
                        color: #fff;
                        background: linear-gradient(90deg, rgba(0,0,0,.2), transparent 25%), #7952a0;
                        box-shadow: 3px 4px 5px rgba(45, 28, 20, .25);
                        writing-mode: vertical-rl;
                        transition: transform .2s ease, box-shadow .2s ease;
                    }
                    .book-card.book-spine:nth-child(4n+2) { background-color: #b94f70; }
                    .book-card.book-spine:nth-child(4n+3) { background-color: #3c7282; }
                    .book-card.book-spine:nth-child(4n+4) { background-color: #987139; }
                    .book-card.book-spine:hover {
                        transform: translateY(-10px) rotate(2deg);
                        box-shadow: 5px 8px 10px rgba(45, 28, 20, .3);
                    }
                    .book-card.book-spine .book-title {
                        color: #fff !important;
                        font-size: 13px;
                        font-weight: 700;
                        margin: 0;
                    }
                    .book-card.book-spine .book-author {
                        color: rgba(255,255,255,.9);
                        font-size: 11px;
                        opacity: 1;
                    }
                    .dog-picture-fallback { font-size: 120px; text-align: center; padding: 25px; }
                    @media (max-width: 768px) {
                        .book-card.book-spine { width: 52px; height: 195px; padding: 10px 6px; }
                    }
                </style>`);

                html = html.replaceAll('class="book-card"', 'class="book-card book-spine"');
                const scythe = '<div class="book-card book-spine"><div class="book-title">Scythe Series</div><div class="book-author">Neal Shusterman</div></div>';
                const alchemyst = '<div class="book-title">The Alchemyst (Book 1)</div>';
                if (!html.includes('Scythe Series') && html.includes(alchemyst)) {
                    html = html.replace(alchemyst, scythe + alchemyst);
                }
                html = html.replace('<img id="dogImage"', '<div class="dog-picture-fallback" aria-label="Dog">🐶</div><img id="dogImage" onerror="this.style.display=\'none\'"');

                document.open();
                document.write(html);
                document.close();
            } catch (error) {
                document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin:15vh auto;max-width:36em;padding:1em;color:#6b5274">I couldn’t load the restored website just now. Please refresh, or <a href="https://github.com/Chocolateistuff/I-am-awesome-/blob/f7f34cfa0251b5b52a2260d33906f139e241cc88/index.html">open the saved original website file</a>.</p>';
                console.error(error);
            }
        })();
    </script>
</body>
</html>
